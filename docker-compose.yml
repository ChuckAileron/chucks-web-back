services:
  postgres:
    image: postgres:16-alpine
    container_name: chucks-web-backend-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chucks_web
    volumes:
      - chucks_web_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chucks_web']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chucks_web_pgdata:
